<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<!-- Question: 玩家调整路网、上下客点和 Robotaxi 车队后，能否看懂拥堵从哪里来，并感到自己的规划决策有效？ -->
<!-- Date: 2026-10-31 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robotaxi 交通原型</title>
<style>
  :root { --bg:#0f1318; --panel:#171c23; --line:#2a313b; --text:#dde3ea; --dim:#8b96a3; --accent:#4fb0ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  #app { display:flex; flex-wrap:wrap; min-height:100vh; }
  #mapWrap { flex:1 1 560px; position:relative; min-height:420px; }
  #map { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }
  #panel { flex:0 0 330px; max-width:100%; background:var(--panel); border-left:1px solid var(--line); padding:12px 14px; overflow-y:auto; max-height:100vh; }
  h1 { font-size:15px; margin:0 0 4px; }
  .q { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .sec { border-top:1px solid var(--line); padding:9px 0; }
  .sec h2 { font-size:12px; color:var(--dim); font-weight:600; margin:0 0 6px; letter-spacing:.04em; }
  .row { display:flex; align-items:center; gap:6px; margin:4px 0; flex-wrap:wrap; }
  button { background:#232a34; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:4px 9px; font:inherit; cursor:pointer; }
  button:hover { border-color:#45505e; }
  button.on { background:#1d3a55; border-color:var(--accent); }
  #clock { font-size:22px; font-variant-numeric:tabular-nums; font-weight:600; }
  label.sl { display:grid; grid-template-columns:96px 1fr 66px; align-items:center; gap:6px; margin:5px 0; }
  label.sl span:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  td, th { padding:2px 4px; text-align:right; }
  td:first-child, th:first-child { text-align:left; color:var(--dim); font-weight:400; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  .hint { color:var(--dim); font-size:12px; }
  .legend span { display:inline-flex; align-items:center; gap:4px; margin-right:10px; font-size:12px; color:var(--dim); }
  .legend i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  #tip { position:absolute; pointer-events:none; background:#0b0e12ee; border:1px solid var(--line); border-radius:5px; padding:6px 8px; font-size:12px; display:none; white-space:nowrap; }
  #report { position:absolute; inset:16px; max-width:780px; margin:0 auto; background:#141a21f2; border:1px solid var(--line); border-radius:8px; padding:16px 18px; overflow:auto; display:none; z-index:5; }
  #report h2 { font-size:17px; margin:0 0 4px; } #report h3 { font-size:13px; color:var(--dim); margin:14px 0 6px; font-weight:600; }
  #report table td, #report table th { padding:4px 6px; vertical-align:middle; }
  #report .big { font-size:28px; font-weight:700; }
  #report .bars div { grid-template-columns:110px 1fr 40px; }
  #report button.go { background:#1d3a55; border-color:var(--accent); padding:6px 14px; }
  #report button:disabled { opacity:.45; cursor:not-allowed; }
  .ok { color:#5fd38d; } .warn { color:#f2b134; } .bad { color:#ff6b6b; }
  #camp { display:flex; gap:10px; flex-wrap:wrap; align-items:baseline; font-size:12px; color:var(--dim); margin:-4px 0 8px; }
  #camp b { color:var(--text); font-size:15px; }
  #chart { width:100%; height:120px; display:block; }
  #legend { margin-top:6px; }
  label.chk { display:flex; align-items:flex-start; gap:6px; margin:5px 0; font-size:12px; }
  label.chk input { margin:2px 0 0; flex:0 0 auto; }
  #phase { font-size:12px; color:#ffd479; min-height:18px; }
  .bars div { display:grid; grid-template-columns:64px 1fr 56px; align-items:center; gap:6px; font-size:12px; margin:2px 0; }
  .bars b { display:block; height:8px; border-radius:2px; }
  .bars span:first-child { color:var(--dim); }
  .bars span:last-child { text-align:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div id="app">
  <div id="mapWrap">
    <canvas id="map"></canvas>
    <div id="tip"></div>
    <div id="report"></div>
  </div>
  <div id="panel">
    <h1>Robotaxi 交通原型</h1>
    <div class="q">测试问题：看准时机把地面停车场改成公园好玩吗？太早改会惹怒司机，太晚改浪费了公园的好处。</div>
    <div id="camp"></div>

    <div class="sec">
      <div class="row"><span id="clock">06:00</span><span class="hint" id="clockSub"></span></div>
      <div id="phase"></div>
      <div class="row">
        <button id="play">暂停</button>
        <span class="hint">速度</span>
        <button data-speed="1">1×</button><button data-speed="10">10×</button><button data-speed="60" class="on">60×</button><button data-speed="180">180×</button><button data-speed="600">600×</button>
      </div>
      <div class="row"><button id="ff">快进到年底</button><button id="reset">重玩今年</button><button id="clearPlan">清空规划</button><button id="restartCamp">重新开始（2028）</button></div>
    </div>

    <div class="sec">
      <h2>工具（点地图）</h2>
      <div class="row">
        <button data-tool="inspect" class="on">查看</button>
        <button data-tool="road">道路</button>
        <button data-tool="bay">上下客点 <span id="bayCount">0/6</span></button>
      </div>
      <div class="hint" id="toolHint">悬停路段查看流量、排队和通行时间；悬停街区查看地块信息。</div>
    </div>

    <div class="sec">
      <h2>视图（地图按什么着色）</h2>
      <div class="row">
        <button data-lens="state" class="on">车辆状态</button>
        <button data-lens="purpose">出行目的</button>
        <button data-lens="demand">叫车热度</button>
        <button data-lens="roads">仅道路</button>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="sec">
      <h2>政策与车队</h2>
      <label class="sl"><span>出行需求</span><input id="demand" type="range" min="0.5" max="2" step="0.05" value="1"><span id="demandV"></span></label>
      <label class="sl"><span>Robotaxi 车费</span><input id="fare" type="range" min="1" max="6" step="0.1" value="2"><span id="fareV"></span></label>
      <label class="chk"><input id="pool" type="checkbox"> 允许拼车（同一路口上车、顺路，最多 3 人，八五折）</label>
      <label class="chk"><input id="taxiOn" type="checkbox" checked> 启用 Robotaxi（关掉 = 对照组：只有私家车和公交）</label>
      <label class="sl"><span>再平衡强度</span><input id="rebal" type="range" min="0" max="1.5" step="0.05" value="0.6"><span id="rebalV"></span></label>
      <label class="sl"><span>车队规模*</span><input id="fleet" type="range" min="50" max="800" step="10" value="350"><span id="fleetV"></span></label>
      <label class="chk"><input id="event" type="checkbox" checked> 今晚体育场有赛事（18:30 入场，21:30 散场）</label>
      <div class="hint">* 车队规模在重开时生效，其余实时生效。</div>
    </div>

    <div class="sec">
      <h2>城市信息</h2>
      <div id="city"></div>
    </div>

    <div class="sec">
      <h2>指标</h2>
      <table id="kpi"></table>
    </div>

    <div class="sec">
      <h2>全天曲线 <span class="legend"><span><i style="background:#4fb0ff"></i>平均车速 km/h</span><span><i style="background:#f2b134"></i>平均候车 分钟</span></span></h2>
      <canvas id="chart"></canvas>
    </div>

    <div class="sec hint">
      路段颜色 = 通行时间 / 自由流时间：绿 → 黄 → 红。虚线 = 封闭。路口红色数字 = 候车人数，灰色数字 = 待命 Robotaxi。街区边框颜色 = 所属片区，灰框 = 地标。
    </div>
  </div>
</div>

<script id="sim">
// PROTOTYPE - NOT FOR PRODUCTION
// Simulation core: mesoscopic link-queue model (MATSim-style), congestion-aware
// routing, robotaxi dispatch and rebalancing. No DOM access, so it can run headless.

const CFG = {
  COLS: 9, ROWS: 7, SPACING: 400,          // grid of intersections, metres
  START: 6 * 3600, END: 23 * 3600,          // simulated day
  VEH_LEN: 7.5,                             // metres of queue per vehicle
  CAP_PER_LANE: 0.13,                       // veh/s per lane (~470/h: signalised approach sharing green time)
  V_ART: 13.9, V_LOC: 11.1,                 // 50 km/h arterials, 40 km/h local
  DWELL: 45,                                // seconds to pick up / drop off
  WALK_END: 60,                             // seconds on foot from kerb/parking to the door
  WALK_SPEED: 1.3,                          // m/s
  // parking: public spaces per block come from BLOCK_TYPES[].spaces; trips home use private parking
  // spaces = measured uncapped peak demand x supply ratio (0.7 in office/shop blocks, 1.3 elsewhere)
  PARK_SCALE: 0.3, PARK_INIT_OCC: 0.1,      // 2028 is a car city: building parking is tight, surface lots fill the gap
  LOT_SCALE: 0.6,                           // surface lots are sized separately from building parking
  LOT_AREA_SCALE: 0.4,                      // buildings around a surface lot have little parking of their own
  CRUISE_MAX: 4,                            // intersections tried before giving up and parking far away
  FAR_WALK: 480,                            // seconds walking from a far-away car park
  PARK_HOURS: { commute: 9, rail: 9, school: 6, medical: 1.5, leisure: 1.5, night: 2.5, event: 3 },
  // public transport is abstract (no buses on the roads): walk + wait + ride, ride = current car time x factor
  PT_WALK: 300, PT_WAIT: 300, PT_FACTOR: 1.6, PT_MIN_RIDE: 180,
  PT_STATION_WALK: 150, PT_STATION_WAIT: 150,                          // intersections next to a rail station
  // mode choice: multinomial logit on generalised cost in yuan (time valued at VOT yuan/min)
  VOT: 0.5, MU: 0.25,
  DRIVE_PER_KM: 0.8, PT_FARE: 2, FARE_BASE: 6,                         // robotaxi per-km fare is the player's lever
  PARK_PRICE: { office: 10, shop: 8, night: 6, museum: 5, stadium: 8, station: 5, hospital: 4, mixed: 3, park: 3, uni: 2, res: 0, industry: 0 },
  ASC_CAR: 0, ASC_TAXI: 0, ASC_PT: 4,                                  // unexplained preference (yuan)
  TAXI_WAIT_PRIOR: 240, ABANDON_PENALTY: 20,                           // expected wait before any experience; cost of a failed request
  POOL_DISCOUNT: 0.25, POOL_TIME: 1.15,                                // expected pooled fare cut and ride-time stretch
  POOL_CAP: 3,                                                         // riders per pooled car (all board at one corner)
  BAY_CAP: 4, BAY_BUDGET: 6,
  MAX_WAIT: 600,                            // passenger gives up after 10 min without a car assigned
  MAX_PICKUP_ETA: 480,                      // dispatcher won't send a car more than 8 min away
  GRAVITY_M: 3000,                          // destination choice decays with distance
  RIVER_ROW: 4, BRIDGES: [1, 4, 7],         // river between rows 4 and 5, crossable only at these columns
  STUCK: 60,                                // force through a full link after this long (avoid gridlock)
  REROUTE_EVERY: 20, DISPATCH_EVERY: 5, REBAL_EVERY: 30, SAMPLE_EVERY: 300,
  UTURN_PENALTY: 120,
  // trips per hour at demand 1.0, by purpose
  AM_PEAK: 6500, PM_PEAK: 6000, RAIL_AM: 2000, RAIL_PM: 1800, RAIL_BASE: 120,
  UNI: 600, HOSP: 300, BASE_RATE: 1200, MID: 1500, NIGHT: 1500, EVENT_IN: 3000, EVENT_OUT: 5000,
};
const gauss = (h, mu, s) => Math.exp(-((h - mu) ** 2) / (2 * s * s));

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---- the city: named blocks between intersections ----
// w = trip-attraction weights the block adds to its four corner intersections.
// spaces = public parking; own = share of residents with a car.
const BLOCK_TYPES = {
  res:      { label: '住宅',   fill: '#26301f', spaces: 220, own: 0.7, w: { home: 6, job: 0.5, leisure: 0.5 } },
  office:   { label: '办公',   fill: '#232c40', spaces: 940, own: 0.35, w: { home: 0.5, job: 10, leisure: 0.5 } },
  shop:     { label: '商业',   fill: '#3a3020', spaces: 825, own: 0.4, w: { home: 1, job: 3, leisure: 5 } },
  mixed:    { label: '混合',   fill: '#2b2e2a', spaces: 800, own: 0.5, w: { home: 3, job: 3, leisure: 1.5 } },
  industry: { label: '产业',   fill: '#33291e', spaces: 1310, own: 0.55, w: { home: 0.3, job: 8 } },
  night:    { label: '夜生活', fill: '#382036', spaces: 750, own: 0.35, w: { home: 1, job: 2, leisure: 2, night: 6 } },
  park:     { label: '公园',   fill: '#1f4a2a', spaces: 620, own: 0.5, w: { leisure: 3 }, icon: '🌳' },
  museum:   { label: '博物馆', fill: '#4a4a42', spaces: 1000, own: 0.5, w: { job: 1, leisure: 4 }, icon: '🏛️' },
  uni:      { label: '大学',   fill: '#434a42', spaces: 730, own: 0.2, w: { home: 1, job: 2, uni: 1 }, icon: '🎓' },
  hospital: { label: '医院',   fill: '#4a4242', spaces: 600, own: 0.5, w: { job: 3, hosp: 1 }, icon: '🏥' },
  stadium:  { label: '体育场', fill: '#42424c', spaces: 2600, own: 0.5, w: { job: 0.5, stadium: 1 }, icon: '🏟️' },
  station:  { label: '火车站', fill: '#454545', spaces: 1900, own: 0.4, w: { job: 1, station: 1 }, icon: '🚉' },
  lot:      { label: '地面停车场', fill: '#3b3e44', spaces: 1600, own: 0.5, w: { job: 0.3 }, icon: '🅿️' },
  greened:  { label: '新公园', fill: '#2a6b3a', spaces: 0, own: 0.5, w: { leisure: 2.5 }, icon: '🌳' },  // a converted lot
};
const GROUPS = {
  brown: ['#8b5a2b', '西北'], sky: ['#5bb4e5', '北岸'], pink: ['#d0457f', '老城'], red: ['#d63c3c', '中央商务'],
  yellow: ['#e3c341', '商圈'], orange: ['#e8873a', '东城'], green: ['#3fae6a', '西滨江'], navy: ['#3d62d6', '江景'],
  purple: ['#8a5cc7', '产业'], teal: ['#2aa198', '南岸'],
};
// [col, row, name, type, group, rail-direction]; block row 4 is the river
const BLOCKS = [
  [0, 0, '北郊住宅', 'res', 'brown'], [1, 0, '枫林住宅', 'res', 'brown'], [2, 0, '大学', 'uni'], [3, 0, '北站', 'station', null, 'n'],
  [4, 0, '书院街', 'mixed', 'sky'], [5, 0, '松柏住宅', 'res', 'sky'], [6, 0, '云杉住宅', 'res', 'sky'], [7, 0, '东郊住宅', 'res', 'sky'],
  [0, 1, '西园住宅', 'res', 'brown'], [1, 1, '体育场', 'stadium'], [2, 1, '文昌停车场', 'lot', 'pink'], [3, 1, '金融街', 'office', 'red'],
  [4, 1, '中央大道', 'office', 'red'], [5, 1, '商业广场', 'shop', 'yellow'], [6, 1, '医院', 'hospital'], [7, 1, '东湖住宅', 'res', 'orange'],
  [0, 2, '西园二区', 'res', 'brown'], [1, 2, '老城区', 'mixed', 'pink'], [2, 2, '市政厅', 'office', 'pink'], [3, 2, '中央公园', 'park'],
  [4, 2, '科技园', 'office', 'red'], [5, 2, '百货大楼', 'shop', 'yellow'], [6, 2, '东城停车场', 'lot', 'orange'], [7, 2, '东站', 'station', null, 'e'],
  [0, 3, '滨江住宅', 'res', 'green'], [1, 3, '码头停车场', 'lot', 'green'], [2, 3, '夜市', 'night', 'green'], [3, 3, '滨江路', 'office', 'navy'],
  [4, 3, '江景大厦', 'office', 'navy'], [5, 3, '博物馆', 'museum'], [6, 3, '滨江停车场', 'lot', 'orange'], [7, 3, '渔人码头', 'night', 'orange'],
  [0, 5, '产业园', 'industry', 'purple'], [1, 5, '产业园二期', 'industry', 'purple'], [2, 5, '南岸住宅', 'res', 'teal'], [3, 5, '南岸停车场', 'lot', 'teal'],
  [4, 5, '南站', 'station', null, 's'], [5, 5, '南岸新城', 'res', 'teal'], [6, 5, '南岸二区', 'res', 'teal'], [7, 5, '南郊住宅', 'res', 'teal'],
].map(([c, r, name, type, group, rail]) => ({ c, r, name, type, group, rail }));
const ATTRS = ['home', 'job', 'leisure', 'night', 'uni', 'hosp', 'stadium', 'station'];

// Trip purposes. Each leg draws origins/destinations from a node weight (gravity-model destinations).
// 'mix' = anyone out and about: home + 1.5 x job.
const PURPOSES = [
  { key: 'commute', label: '通勤', color: '#4fb0ff', legs: [
    { rate: h => CFG.AM_PEAK * gauss(h, 8, 0.8), o: 'home', d: 'job' },
    { rate: h => CFG.PM_PEAK * gauss(h, 17.5, 1.0), o: 'job', d: 'home' }] },
  { key: 'rail', label: '车站接驳', color: '#f28c38', legs: [
    { rate: h => CFG.RAIL_AM * gauss(h, 8.2, 0.7), o: 'station', d: 'job' },
    { rate: h => CFG.RAIL_PM * gauss(h, 17.6, 0.9), o: 'job', d: 'station' },
    { rate: () => CFG.RAIL_BASE, o: 'station', d: 'mix' },
    { rate: () => CFG.RAIL_BASE, o: 'mix', d: 'station' }] },
  { key: 'school', label: '上学', color: '#9be36b', legs: [
    { rate: h => CFG.UNI * gauss(h, 8.3, 0.6), o: 'home', d: 'uni' },
    { rate: h => CFG.UNI * 0.8 * gauss(h, 16.5, 1.2), o: 'uni', d: 'home' }] },
  { key: 'medical', label: '就医', color: '#ff6b6b', legs: [
    { rate: h => CFG.HOSP * gauss(h, 11, 2.5), o: 'home', d: 'hosp' },
    { rate: h => CFG.HOSP * gauss(h, 14, 2.5), o: 'hosp', d: 'home' }] },
  { key: 'leisure', label: '购物休闲', color: '#e3c341', legs: [
    { rate: h => CFG.BASE_RATE + CFG.MID * gauss(h, 12.5, 1.2), o: 'mix', d: 'leisure' }] },
  { key: 'night', label: '夜生活', color: '#c77dff', legs: [
    { rate: h => CFG.NIGHT * gauss(h, 20, 1.2), o: 'mix', d: 'night' },
    { rate: h => CFG.NIGHT * 0.7 * gauss(h, 22, 0.6), o: 'night', d: 'home' }] },
  { key: 'event', label: '体育赛事', color: '#ff9de2', event: true, legs: [
    { rate: h => CFG.EVENT_IN * gauss(h, 18.6, 0.45), o: 'home', d: 'stadium' },
    { rate: h => CFG.EVENT_OUT * gauss(h, 21.6, 0.25), o: 'stadium', d: 'home' }] },
];
function segKey(a, b) { return a < b ? a + '-' + b : b + '-' + a; }

function createSim(params, plan) {
  const C = CFG;
  const rng = mulberry32(params.seed);
  const nodes = [], links = [], segs = {};
  const N = C.COLS * C.ROWS;
  // per-run copy of the map: lots converted in earlier years are parks now
  const blocks = BLOCKS.map(b => ({ ...b, wasLot: b.type === 'lot',
    type: plan.converted && plan.converted.has(b.name) ? 'greened' : b.type }));

  for (let r = 0; r < C.ROWS; r++) for (let c = 0; c < C.COLS; c++) {
    nodes.push({ id: r * C.COLS + c, c, r, x: c * C.SPACING, y: r * C.SPACING,
      w: Object.fromEntries(ATTRS.map(a => [a, 0])),
      out: [], in: [], idle: [], stop: [], entry: [], waiting: [],
      bay: false, reqCount: 0, reqTotal: 0, dem: 0, cap: 0, parked: 0, modes: { car: 0, taxi: 0, transit: 0 } });
  }
  for (const b of blocks) b.nodes = [[b.c, b.r], [b.c + 1, b.r], [b.c, b.r + 1], [b.c + 1, b.r + 1]].map(([c, r]) => r * C.COLS + c);
  const lotArea = new Set(blocks.filter(b => b.wasLot).flatMap(b => b.nodes));
  for (const b of blocks) {
    const T = BLOCK_TYPES[b.type], bw = T.w;
    for (const id of b.nodes) {
      for (const a in bw) nodes[id].w[a] += bw[a] / 4;
      const scale = b.type === 'lot' ? C.LOT_SCALE : C.PARK_SCALE * (lotArea.has(id) ? C.LOT_AREA_SCALE : 1);
      nodes[id].cap += T.spaces * scale / 4;
      nodes[id].ownW = (nodes[id].ownW || 0) + (bw.home || 0) * T.own / 4;
    }
  }
  for (const n of nodes) {
    n.cap = Math.round(n.cap); n.parked = Math.round(n.cap * C.PARK_INIT_OCC);
    n.own = (n.w.home > 0 ? n.ownW / n.w.home : 0.5) * (plan.ownMult ? plan.ownMult[n.id] : 1);  // car ownership of residents
    const types = blocks.filter(b => b.nodes.includes(n.id)).map(b => b.type);
    n.parkPrice = types.length ? types.reduce((a, k) => a + C.PARK_PRICE[k], 0) / types.length : 0;

  const weightOf = (n, k) => k === 'mix' ? n.w.home + n.w.job * 1.5 : n.w[k];

      let a = 0;

    population: Math.round(blocks.reduce((a, b) => a + (BLOCK_TYPES[b.type].w.home || 0), 0) * 900),

    stats: { carTrips: 0, carTimeSum: 0, taxiTrips: 0, taxiRideSum: 0, pickups: 0, waitSum: 0,

      byPurpose: Object.fromEntries(PURPOSES.map(p => [p.key, 0])),
      d2d: { car: [0, 0], taxi: [0, 0], transit: [0, 0] },            // door-to-door [seconds, trips] by final mode
      cruises: 0, cruiseDist: 0, farParks: 0, ptTrips: 0, fbCar: 0, fbTransit: 0, pooledRiders: 0, poolJoins: 0, searchSec: 0, searchN: 0 },

  for (let i = 0; i < params.fleet; i++) {

  // ---- routing ----
  function updateCosts() {
    for (const L of links) {

  // ---- demand ----

  function modeCosts(trip) {

    const km = (Math.abs(o.x - d.x) + Math.abs(o.y - d.y)) / 1000;

// ---- campaign: 2028-2036, one representative day per year ----
// Between years the player spends influence converting surface lots into parks. Converting
// too early starves drivers of parking; too late wastes the years a park would have paid off.
const CAMPAIGN = {
  START_YEAR: 2028, YEARS: 9,
  TRUST0: 5, TRUST_STEP: 1,               // robotaxi novelty penalty (yuan), shrinking every year
  SELL_RATE: 0.06, SELL_REF: 0.3,         // car ownership falls SELL_RATE/yr where robotaxi share is SELL_REF
  INFLUENCE0: 15, CONVERT_COST: 12, INFLUENCE_PER_SAT: 0.5, SAT_FLOOR: 35,
  OVERFLOW_PENALTY: 150,                  // parking points lost per 100% shortfall around a lot
  // Tearing out a lot that is still busy angers drivers. Usage = last year's peak demand / spaces left after.
  BACKLASH_FROM: 0.85, BACKLASH_INFLUENCE: 40, BACKLASH_ANGER: 120, ANGER_DECAY: 0.5,

function campaignYear(camp) { return CAMPAIGN.START_YEAR + camp.year; }
function campaignParams(camp) { return { taxiAsc: Math.max(0, CAMPAIGN.TRUST0 - CAMPAIGN.TRUST_STEP * camp.year) }; }

function satisfactionOf(sim, camp) {
  const s = sim.summary(), clamp = v => Math.max(0, Math.min(100, v));
  const parts = {
    travel: clamp(100 - 6 * (s.d2d - 7)),                  // door-to-door minutes
    // drivers: citywide search time, plus complaints wherever peak demand around a lot exceeds its supply
    parking: clamp(100 - 15 * s.searchMin - CAMPAIGN.OVERFLOW_PENALTY *
      sim.lotStats().reduce((a, l) => a + Math.max(0, l.demand / l.supply - 1), 0) - camp.anger),
    green: clamp(30 + 14 * camp.converted.size),           // residents: new parks
    curb: clamp(100 - s.curbStops / 800),                  // everyone: robotaxis blocking lanes
  };

}
function closeYear(camp, sim) {
  const sat = satisfactionOf(sim, camp);
  const gain = Math.max(0, Math.round((sat.total - CAMPAIGN.SAT_FLOOR) * CAMPAIGN.INFLUENCE_PER_SAT));
  camp.history.push({ year: campaignYear(camp), sat, gain, lots: sim.lotStats(), summary: sim.summary(), converted: [...camp.converted] });
  camp.influence += gain;
  for (const n of sim.nodes) {                             // residents sell cars where robotaxis serve them
    const m = n.modes, tot = m.car + m.taxi + m.transit;
    if (tot) camp.ownMult[n.id] *= 1 - CAMPAIGN.SELL_RATE * Math.min(1.5, m.taxi / tot / CAMPAIGN.SELL_REF);
  }
  camp.anger *= CAMPAIGN.ANGER_DECAY;
  camp.year++;
  camp.done = camp.year >= CAMPAIGN.YEARS;
}
// What converting a lot would cost now, judged on last year's usage. Proposals need a year of data.
function conversionQuote(camp, name) {
  const o = lotOutlook(camp, name);
  if (!o || o.converted) return null;
  const usage = o.supplyAfter > 0 ? o.demand / o.supplyAfter : 9;
  const backlash = Math.max(0, usage - CAMPAIGN.BACKLASH_FROM);
  return { usage, backlash, cost: Math.round(CAMPAIGN.CONVERT_COST + CAMPAIGN.BACKLASH_INFLUENCE * backlash),
    anger: Math.round(CAMPAIGN.BACKLASH_ANGER * backlash) };
}
function convertLot(camp, name) {
  const q = conversionQuote(camp, name);
  if (camp.done || !q || camp.influence < q.cost) return false;
  camp.influence -= q.cost; camp.anger += q.anger;
  camp.converted.add(name); camp.convertedIn[name] = campaignYear(camp);

}
// Last year's peak demand around a lot, and a naive trend forecast for next year.
function lotOutlook(camp, name) {
  const h = camp.history.map(y => y.lots.find(l => l.name === name));
  if (!h.length) return null;
  const last = h[h.length - 1], prev = h[h.length - 2];

}
function campaignScore(camp) {
  const sats = camp.history.map(y => y.sat.total);

}

    }
    if (n.waiting.length) {
      ctx.fillStyle = '#d64545'; ctx.beginPath(); ctx.arc(x + 14, y - 14, 8, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(n.waiting.length, x + 14, y - 14);
    }
    if (n.idle.length) { ctx.fillStyle = '#8b96a3'; ctx.fillText(n.idle.length, x + 14, y + 14); }
  }
  if (tool === 'bay' && mouse) {
    const n = nearestNode(mouse.x, mouse.y);
    if (n) { ctx.strokeStyle = '#7fd3a5'; ctx.lineWidth = 1.5; ctx.strokeRect(X(n.x) - 12, Y(n.y) - 12, 24, 24); }
  }
  if (tool !== 'bay' && mouse) {
    const L = nearestLink(mouse.x, mouse.y);
    if (L) {
      const g = laneGeom(L);
      ctx.strokeStyle = '#ffffff88'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(g.x1, g.y1); ctx.lineTo(g.x2, g.y2); ctx.stroke();
    } else if (tool === 'inspect') {
      const b = blockAt(mouse.x, mouse.y);
      if (b) { const { x, y, s } = blockRect(b); ctx.strokeStyle = '#ffffffcc'; ctx.lineWidth = 2; ctx.strokeRect(x - 2, y - 2, s + 4, s + 4); }
    }
  }
}
function fmtClock(t) { const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60); return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'); }
function drawPanel() {
  $('clock').textContent = fmtClock(sim.t);
  const busy = sim.taxis.filter(v => v.state !== 'idle').length;
  $('clockSub').textContent = `路上 ${sim.onNet || 0} 辆 · 候车 ${sim.nodes.reduce((a, n) => a + n.waiting.length, 0)} 人 · 车队忙碌 ${busy}/${sim.taxis.length}`;
  $('phase').textContent = phaseText(sim.t / 3600);
  drawCamp();
  drawCity();
  const s = sim.summary(), p = prevSummary;
  const rows = [
    ['<b style="color:var(--text)">人均门到门 分钟</b>', x => `<b>${x.d2d.toFixed(1)}</b>`],
    ['出行方式 车/Robotaxi/公交 %', x => `${x.shareCar.toFixed(0)}/${x.shareTaxi.toFixed(0)}/${x.shareTransit.toFixed(0)}`],
    ['平均车速 km/h', x => x.speed.toFixed(1)],
    ['Robotaxi 候车 分钟', x => x.wait.toFixed(1)],
    ['放弃叫车 %', x => x.abandonPct.toFixed(1)],
    ['拼车乘客 %', x => x.pooledPct.toFixed(0)],
    ['Robotaxi 空驶 %', x => x.emptyPct.toFixed(1)],
    ['找车位绕行 km', x => x.cruiseKm.toFixed(0)],
    ['总车公里', x => x.vkt.toFixed(0)],
    ['路边占道停靠', x => x.curbStops.toFixed(0)],
  ];
  $('kpi').innerHTML = '<tr><th></th><th>今年</th><th>去年</th></tr>' +
    rows.map(([name, f]) => `<tr><td>${name}</td><td>${f(s)}</td><td>${p ? f(p) : '—'}</td></tr>`).join('') +
    '<tr><td colspan="3" class="hint" style="text-align:left">门到门 = 出门到抵达目的地的总时间（含步行、候车、找车位），是判断 Robotaxi 好坏的主指标，越低越好。</td></tr>';
}
function phaseText(h) {
  const ev = sim.params.event;
  if (ev && h >= 21 && h < 22.2) return '🏟️ 赛事散场：体育场周边叫车激增';
  if (ev && h >= 17.8 && h < 19.2) return '晚高峰 · 🏟️ 体育场赛事入场';
  if (h < 7) return '清晨：车流稀少';
  if (h < 9.5) return '早高峰：通勤、车站接驳、上学';
  if (h < 11.5) return '平峰';
  if (h < 13.5) return '午间：购物休闲';
  if (h < 16) return '平峰';
  if (h < 19.5) return '晚高峰：下班通勤、车站接驳';
  if (h < 22.2) return '夜间：夜生活';
  return '深夜：夜生活返程';
}
let cityShown = -1;
function ownRate(sm) {
  const h = sm.nodes.reduce((a, n) => a + n.w.home, 0);
  return (sm.nodes.reduce((a, n) => a + n.own * n.w.home, 0) / h * 100).toFixed(0);
}
function drawCity() {
  if (sim.t === cityShown) return;                                   // only when the sim has advanced
  cityShown = sim.t;
  const S = sim.stats, total = PURPOSES.reduce((a, p) => a + S.byPurpose[p.key], 0) || 1;
  const D = S.d2d, done = D.car[1] + D.taxi[1] + D.transit[1] || 1, pct = v => (v / done * 100).toFixed(0) + '%';
  $('city').innerHTML =
    `<div class="row hint">人口（按住宅估算）<b style="color:var(--text);margin-left:auto">${sim.population.toLocaleString()}</b></div>` +
    `<div class="row hint">市民自己选的出行方式：私家车 ${pct(D.car[1])} · Robotaxi ${pct(D.taxi[1])} · 公交 ${pct(D.transit[1])}</div>` +
    (S.abandoned ? `<div class="row hint">叫不到车改用其他方式：${S.abandoned} 人（开车 ${S.fbCar}，公交 ${S.fbTransit}）</div>` : '') +
    `<div class="row hint">私家车拥有率（按居民）：${ownRate(sim)}%${camp.history.length ? `（2028 年 ${camp.history[0].own}%）` : ''}</div>` +
    `<div class="hint" style="margin:6px 0 2px">今日出行目的（共 ${total.toLocaleString()} 次）</div>` +
    `<div class="bars">${PURPOSES.map(p => {
      const v = S.byPurpose[p.key];
      return `<div><span>${p.label}</span><b style="width:${(v / total * 100).toFixed(1)}%;background:${p.color}"></b><span>${(v / total * 100).toFixed(0)}%</span></div>`;
    }).join('')}</div>`;
}
function drawChart() {
  const dpr = view.dpr, W = chart.width / dpr, H = chart.height / dpr;
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cctx.clearRect(0, 0, W, H);
  const x = t => 4 + (t - CFG.START) / (CFG.END - CFG.START) * (W - 8), pad = 14;
  cctx.strokeStyle = '#2a313b'; cctx.lineWidth = 1; cctx.fillStyle = '#8b96a3'; cctx.font = '10px system-ui,sans-serif'; cctx.textAlign = 'center';
  for (let h = 6; h <= 22; h += 4) { const xx = x(h * 3600); cctx.beginPath(); cctx.moveTo(xx, 0); cctx.lineTo(xx, H - pad); cctx.stroke(); cctx.fillText(h + ':00', Math.min(Math.max(xx, 14), W - 14), H - 3); }
  const line = (key, max, col) => {
    cctx.strokeStyle = col; cctx.lineWidth = 2; cctx.beginPath(); let started = false;
    for (const s of sim.series) {
      if (s[key] == null) continue;
      const yy = (H - pad) - Math.min(s[key] / max, 1) * (H - pad - 4);
      if (!started) { cctx.moveTo(x(s.t), yy); started = true; } else cctx.lineTo(x(s.t), yy);
    }
    cctx.stroke();
  };
  line('speed', 50, '#4fb0ff'); line('wait', 15, '#f2b134');
  cctx.textAlign = 'left'; cctx.fillStyle = '#4fb0ff'; cctx.fillText('50', 2, 8); cctx.fillStyle = '#f2b134'; cctx.fillText('15', 18, 8);
}

// ---- picking ----
function nearestNode(mx, my) {
  let best = null, bd = 16;
  for (const n of sim.nodes) { const d = Math.hypot(X(n.x) - mx, Y(n.y) - my); if (d < bd) { bd = d; best = n; } }
  return best;
}
function nearestLink(mx, my) {
  let best = null, bd = 8;
  for (const L of sim.links) {
    const g = laneGeom(L), dx = g.x2 - g.x1, dy = g.y2 - g.y1;
    const t = Math.max(0, Math.min(1, ((mx - g.x1) * dx + (my - g.y1) * dy) / (dx * dx + dy * dy)));
    const d = Math.hypot(g.x1 + dx * t - mx, g.y1 + dy * t - my);
    if (d < bd) { bd = d; best = L; }
  }
  return best;
}
function lotTip(B) {
  if (!B.wasLot) return '';
  if (B.type === 'greened') return `<br><span class="ok">${camp.convertedIn[B.name]} 年由停车场改成公园</span>`;
  const o = lotOutlook(camp, B.name);
  return o ? `<br>去年高峰需求 ${o.demand} 辆 · 改造后剩 ${o.supplyAfter} 个车位（年度报告里可以改造）` : '<br>第一年结束后才有使用数据，才能提出改造';
}
function blockAt(mx, my) {
  return sim.blocks.find(b => { const { x, y, s } = blockRect(b); return mx >= x && mx <= x + s && my >= y && my <= y + s; });
}
// A segment is named after the blocks on either side of it, e.g. "金融街 / 中央大道 之间".
const BRIDGE_NAMES = { 1: '西桥', 4: '中央大桥', 7: '东桥' };
function linkName(L) {
  const a = sim.nodes[L.from], b = sim.nodes[L.to];
  if (L.bridge) return `${BRIDGE_NAMES[a.c] || '大桥'}（${b.r > a.r ? '向南' : '向北'}）`;
  const side = a.r === b.r
    ? [[Math.min(a.c, b.c), a.r - 1], [Math.min(a.c, b.c), a.r]]
    : [[a.c - 1, Math.min(a.r, b.r)], [a.c, Math.min(a.r, b.r)]];
  const names = side.map(([c, r]) => sim.blocks.find(k => k.c === c && k.r === r)).filter(Boolean).map(k => k.name);
  const dir = a.r === b.r ? (b.c > a.c ? '向东' : '向西') : (b.r > a.r ? '向南' : '向北');
  return (names.length ? names.join(' / ') + ' 旁' : '城市边缘') + `（${dir}）`;
}
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect(); mouse = { x: e.clientX - r.left, y: e.clientY - r.top };
  const tip = $('tip');
  const L = tool === 'inspect' ? nearestLink(mouse.x, mouse.y) : null;
  const B = tool === 'inspect' && !L ? blockAt(mouse.x, mouse.y) : null;
  if (!L && !B) { tip.style.display = 'none'; return; }
  if (L) {
    // who is on this link: the composition behind the colour
    const c = { car: 0, cruise: 0, pickup: 0, occupied: 0, rebal: 0, dwell: 0, riders: 0 };
    for (const v of L.q) {
      if (v.dwelling) c.dwell++;
      if (v.kind === 'car') c[v.cruise ? 'cruise' : 'car']++;
      else { c[v.state]++; if (v.state === 'occupied') c.riders += v.riders.length; }
    }
    const part = (n, label, col) => n ? `<span style="color:${col}">${label} ${n}</span>` : '';
    const mix = [part(c.car, '私家车', '#c3cad3'), part(c.cruise, '找车位', '#ff7eb6'), part(c.pickup, '去接客', '#f2b134'),
      part(c.occupied, `载客（${c.riders} 人）`, '#2bb3c0'), part(c.rebal, '再平衡', '#a678de'), part(c.dwell, '路边停靠', '#ff5a5a')].filter(Boolean).join(' · ');
    tip.innerHTML = `<b>${linkName(L)}</b> · ${L.closed ? '封闭' : L.lanes + ' 车道'}<br>` +
      `车辆 ${L.q.length} / 容量 ${L.storage}${mix ? '：' + mix : ''}<br>` +
      `预计通行 ${isFinite(L.cost) ? L.cost.toFixed(0) : '∞'} 秒（自由流 ${L.fftt.toFixed(0)} 秒）<br>` +
      `近 5 分钟流量 ${L.flow.toFixed(0)} 辆/小时（通行能力 ${Math.round(L.rate * 3600)}）`;
  } else {
    const T = BLOCK_TYPES[B.type], ns = B.nodes.map(id => sim.nodes[id]);
    const wait = ns.reduce((a, n) => a + n.waiting.length, 0), dem = ns.reduce((a, n) => a + n.dem, 0) / 4;
    const parked = ns.reduce((a, n) => a + n.parked, 0), cap = ns.reduce((a, n) => a + n.cap, 0);
    const taxiWait = ns.reduce((a, n) => a + n.waitEma, 0) / 4 / 60, price = ns.reduce((a, n) => a + n.parkPrice, 0) / 4;
    tip.innerHTML = `<b>${T.icon ? T.icon + ' ' : ''}${B.name}</b> · ${T.label}` +
      (B.group ? ` · <span style="color:${GROUPS[B.group][0]}">${GROUPS[B.group][1]}片区</span>` : ' · 地标') + '<br>' +
      `四角路口候车 ${wait} 人 · 预测叫车 ${dem.toFixed(1)} / 15 分钟<br>` +
      `周边停车位 ${parked} / ${cap}${parked >= cap ? ' <b style="color:#ff7eb6">已满</b>' : ''} · 停车费约 ${price.toFixed(0)} 元<br>` +
      `这里的人最近叫车平均等 ${taxiWait.toFixed(1)} 分钟` + lotTip(B);
  }
  tip.style.display = 'block';
  tip.style.left = Math.min(mouse.x + 14, r.width - tip.offsetWidth - 6) + 'px';
  tip.style.top = Math.min(mouse.y + 14, r.height - tip.offsetHeight - 6) + 'px';
});
canvas.addEventListener('mouseleave', () => { mouse = null; $('tip').style.display = 'none'; });
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  if (tool === 'road') {
    const L = nearestLink(mx, my); if (!L) return;
    const cur = L.closed ? 0 : L.lanes, next = cur === 1 ? 2 : cur === 2 ? 0 : 1;
    plan.lanes[L.key] = next; sim.setLanes(L.key, next);
  } else if (tool === 'bay') {
    const n = nearestNode(mx, my); if (!n) return;
    if (plan.bays.has(n.id)) { plan.bays.delete(n.id); sim.setBay(n.id, false); }
    else if (plan.bays.size < CFG.BAY_BUDGET) { plan.bays.add(n.id); sim.setBay(n.id, true); }
    updateBayCount();
  }
});

// ---- loop ----
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (running) {
    acc += dt * speed;
    let steps = Math.floor(acc); acc -= steps;
    if (ff) { steps = 4000; acc = 0; }
    while (steps-- > 0) {
      if (!sim.step()) { running = false; $('play').textContent = '继续'; acc = 0; endYear(); break; }
    }
  }
  draw(running && speed <= 10 ? acc : 0);
  drawPanel(); drawChart();
  requestAnimationFrame(frame);
}
// ---- campaign UI ----
function drawCamp() {
  const last = camp.history.at(-1);
  $('camp').innerHTML = `<span><b>${camp.done ? '战役结束' : campaignYear(camp) + ' 年'}</b> 第 ${Math.min(camp.year + 1, CAMPAIGN.YEARS)}/${CAMPAIGN.YEARS} 年</span>` +
    `<span>政策影响力 <b>${camp.influence}</b></span>` +
    `<span>上年满意度 <b>${last ? last.sat.total.toFixed(0) : '—'}</b></span>` +
    `<span>新公园 <b>${camp.converted.size}</b>/5</span>`;
}
function endYear() {
  ff = false;
  closeYear(camp, sim);
  camp.history.at(-1).own = camp.history.length === 1 ? ownRate(sim) : camp.history[0].own;
  showReport();
}
function spark(series, supply, after) {
  const W = 130, H = 38, max = Math.max(supply, ...series, 1) * 1.08;
  const x = i => 4 + i * (W - 8) / (CAMPAIGN.YEARS - 1), y = v => H - 3 - v / max * (H - 6);
  const pts = series.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg width="${W}" height="${H}" style="display:block">` +
    `<line x1="2" x2="${W - 2}" y1="${y(supply)}" y2="${y(supply)}" stroke="#8b96a3" stroke-width="1"/>` +
    `<line x1="2" x2="${W - 2}" y1="${y(after)}" y2="${y(after)}" stroke="#5fd38d" stroke-width="1.5" stroke-dasharray="4 3"/>` +
    `<polyline points="${pts}" fill="none" stroke="#f2b134" stroke-width="2"/>` +
    series.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="2.2" fill="#f2b134"/>`).join('') + `</svg>`;
}
const PART_NAMES = { travel: '出行（门到门）', parking: '停车（司机）', green: '绿地（居民）', curb: '路边占道' };
function showReport() {
  const y = camp.history.at(-1), S = y.summary;
  const bars = Object.entries(y.sat.parts).map(([k, v]) =>
    `<div><span>${PART_NAMES[k]}</span><b style="width:${v.toFixed(0)}%;background:${v >= 70 ? '#5fd38d' : v >= 45 ? '#f2b134' : '#ff6b6b'}"></b><span>${v.toFixed(0)}</span></div>`).join('');
  const lots = BLOCKS.filter(b => b.type === 'lot').map(b => {
    const o = lotOutlook(camp, b.name), q = conversionQuote(camp, b.name);
    if (o.converted) return `<tr><td>🌳 ${b.name.replace('停车场', '公园')}</td><td colspan="3" class="ok">${camp.convertedIn[b.name]} 年改成公园</td><td>${spark(o.series, o.supply, o.supplyAfter)}</td><td></td></tr>`;
    const cls = q.usage < CAMPAIGN.BACKLASH_FROM ? 'ok' : q.usage < 1.1 ? 'warn' : 'bad';
    const mood = cls === 'ok' ? '司机不太在意' : cls === 'warn' ? '有反对声' : '司机强烈反对';
    const can = !camp.done && camp.influence >= q.cost;
    return `<tr><td>🅿️ ${b.name}</td><td>${o.demand} / ${o.supply}</td><td>${o.supplyAfter}</td>` +
      `<td class="${cls}">${(q.usage * 100).toFixed(0)}% · ${mood}</td><td>${spark(o.series, o.supply, o.supplyAfter)}</td>` +
      `<td>${camp.done ? '' : `<button data-convert="${b.name}" ${can ? '' : 'disabled'}>改成公园 −${q.cost} 影响力${q.anger ? ` · 民怨 +${q.anger}` : ''}</button>`}</td></tr>`;
  }).join('');
  const final = camp.done ? `<h3>战役结束</h3><div>九年平均满意度 <span class="big">${campaignScore(camp).toFixed(1)}</span></div>
      <div class="hint">改造时间：${Object.entries(camp.convertedIn).map(([n, yr]) => `${n.replace('停车场', '')} ${yr}`).join('，') || '一个也没改'}</div>
      <div class="row" style="margin-top:10px"><button class="go" id="again">再玩一局（2028）</button></div>`
    : `<div class="row" style="margin-top:12px"><button class="go" id="next">进入 ${campaignYear(camp)} 年 ▶</button>
       <span class="hint">停车需求会随着市民卖掉私家车逐年下降；改造在下一年生效。</span></div>`;
  $('report').innerHTML = `<h2>${y.year} 年度报告</h2>
    <div class="row hint">满意度 <span class="big" style="color:var(--text)">${y.sat.total.toFixed(0)}</span>
      政策影响力 +${y.gain} → <b style="color:var(--text)">${camp.influence}</b>${camp.anger >= 1 ? ` · 司机民怨 ${camp.anger.toFixed(0)}（每年减半）` : ''}</div>
    <div class="bars" style="max-width:420px">${bars}</div>
    <div class="hint">门到门 ${S.d2d.toFixed(1)} 分钟 · 找车位 ${S.searchMin.toFixed(1)} 分钟 · 出行方式 车/Robotaxi/公交 ${S.shareCar.toFixed(0)}/${S.shareTaxi.toFixed(0)}/${S.shareTransit.toFixed(0)}%</div>
    <h3>地面停车场：高峰需求 vs 车位</h3>
    <table><tr><th>停车场</th><th>高峰需求 / 现有车位</th><th>改造后车位</th><th>改造后使用率</th><th>历年需求 <span class="hint">（橙）· 现有（灰）· 改造后（绿虚线）</span></th><th></th></tr>${lots}</table>
    <div class="hint">使用率 = 去年高峰需求 ÷ 改造后剩下的车位。低于 ${CAMPAIGN.BACKLASH_FROM * 100}% 改造几乎没有反对；越高，花的影响力越多，司机的民怨也越大。</div>
    ${final}`;
  $('report').style.display = 'block';
  $('report').querySelectorAll('[data-convert]').forEach(btn => btn.onclick = () => { convertLot(camp, btn.dataset.convert); showReport(); });
  const nx = $('next'); if (nx) nx.onclick = () => { prevSummary = camp.history.at(-1).summary; newDay(); running = true; $('play').textContent = '暂停'; };
  const ag = $('again'); if (ag) ag.onclick = () => $('restartCamp').onclick();
}

newDay(); resize(); updateBayCount();
requestAnimationFrame(frame);
</script>
</body>
</html>
